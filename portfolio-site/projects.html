<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Projects</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<h2>My portfolio</h2>
		<nav aria-label="Main navigation">
			<a href="home.html">home</a>
			<a href="about.html">about</a>
			<a href="projects.html">projects</a>
			<a href="index.html">index</a>
			<a href="contact.html">contact</a>
		</nav>
	</header>

	<main>
		<section>
			<h1>Projects</h1>
			<p>Add a project and save it to your browser.</p>
		</section>

		<section>
			<h2>Add New Project</h2>
			<form id="projectForm">
				<label for="projectTitle">Project title</label>
				<input id="projectTitle" name="title" type="text" required>

				<label for="projectDescription">Description</label>
				<textarea id="projectDescription" name="description" rows="4" required></textarea>

				<label for="projectLink">Project URL</label>
				<input id="projectLink" name="url" type="url" placeholder="https://example.com" required>

				<button type="submit">Save Project</button>
			</form>
			<p id="saveStatus" aria-live="polite"></p>
		</section>

		<section>
			<h2>Saved Projects</h2>
			<div id="projectList" class="project-grid"></div>
		</section>
	</main>

	<footer>Copy rights to Salah Al Shanfari 2026</footer>
	<script src="js/projects.js"></script>
</body>
</html>
